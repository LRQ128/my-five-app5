name: local_ai_assistant
description: 全本地AI助手 - 对标OpenClaw，本地大模型推理+Agent工具调用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI
  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.6.22
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0

  # 本地存储
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # 网络
  http: ^1.2.1

  # 工具
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^11.3.0

  # 向量检索（本地知识库）
  sentencepiece: ^0.1.0
  # dart_phonem: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
