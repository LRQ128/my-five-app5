name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -3 || المجرهtrue

      - name: Save diagnostics
        run: |
          mkdir -p /tmp/diag
          flutter doctor -v > /tmp/diag/01_flutter_doctor.txt 2>&1 || true
          env | sort > /tmp/diag/02_env.txt

      - name: Flutter clean + rm android
        run: |
          flutter clean 2>&1 || true
          rm -rf android/

      - name: Flutter create Android project
        run: |
          flutter create --platforms=android --project-name=local_ai_assistant . 2>&1 | tee /tmp/diag/04_flutter_create.txt
          echo "exit code: $?" | tee -a /tmp/diag/04_flutter_create.txt
          ls -la android/ 2>&1 | tee -a /tmp/diag/04_flutter_create迷糊糊.txtick

      - name: Apply custom config
        run: |
          mkdir -p assets/models/ fonts/
          touch assets/models/.gitkeep fonts/.gitkeep
          sed -i 's|minSdk = flutter\.minSdkVersion|minSdk 26|' android/app/build.gradle
          cat > android/app/src/main/AndroidManifest.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
    <uses-permission android:name="android.permission.READ_CALENDAR"/>
    <uses-permission android:name="android.permission.WRITE_CALENDAR"/>
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
    <application
        android:largeHeap="true"
        android:label="本地智能助手"
        android:name="${applicationName}"
        android:icon="@mipmap/ic_launcher">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:taskAffinity=""
            android:theme="@style/LaunchTheme"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize">
            <meta-data
              android:name="io.flutter.embedding.android.NormalTheme"
              android:resource="@style/NormalTheme"
              />
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <meta-data
            android:name="flutterEmbedding"
            android:value="2" />
    </application>
</manifest>
XMLEOF

      - name: Flutter pub get
        run: flutter pub get 2>&1 | tee /tmp/diag/08_pub_get.txt

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee /tmp/diag/09_build_log.txt
          exit ${PIPESTATUS[0]}

      - name: Sign APK
        run: |
          keytool -genkey -v \
            -keystore android/app/release.jks \
            -alias local-ai-assistant \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass localai123456 \
            -keypass localai123456 \
            -dname "CN=LocalAI, OU=Dev, O=Personal, L=BJ, ST=BJ, C=CN"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.jks \
            --ks-key-alias local-ai-assistant \
            --ks-pass pass:localai123456 \
            --key-pass pass:localai123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          ls -la "$APK_PATH"
          echo "apk_size=$(stat -c%s "$APK_PATH")" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          mkdir -p upload

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Local AI Assistant v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## 本地智能助手
            
            🤖 基于 Flutter 3.27.4 构建
            
            ### 功能
            - 本地 AI 对话
            - 模型管理
            - 日程管理
            - 设置页面
            
            ### 构建信息
            - Commit: ${{ github.sha }}
            - Run: #${{ github.run_number }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: /tmp/diag/

      - name: Save build failure log
        if: failure()
        run: |
          {
            echo "Build failed at $(date -u)"
            echo ""
            echo "## Run #${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo '```'
            cat /tmp/diag/09_build_log.txt 2>/dev/null || echo "No build log"
            echo '```'
            echo ""
            cat /tmp/step_status.txt 2>/dev/null || true
            echo ""
            flutter doctor 2>&1 || true
          } > /tmp/build_failure_${{ github.run_number }}.md
          git config user.email "ci@github.actions"
          git config user.name "GitHub Actions"
          git add /tmp/build_failure_${{ github.run_number }}.md
          cp /tmp/build_failure_${{ github.run_number }}.md build_failure_${{ github.run_number }}.md
          git add build_failure_${{ github.run_number }}.md || true
          git commit -m "build failure log for run #${{ github.run_number }}" || true
          git push || true
