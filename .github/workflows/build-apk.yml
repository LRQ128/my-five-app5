name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Delete old Android config & regenerate
        run: |
          rm -rf android/
          flutter create --platforms android --project-name local_ai_assistant --force .
          # 恢复我们的 AndroidManifest.xml 自定义内容（权限等）
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            # 添加自定义权限
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />|' android/app/src/main/AndroidManifest.xml
            # 添加 largeHeap
            sed -i 's|<application|<application\n        android:largeHeap="true"|' android/app/src/main/AndroidManifest.xml
            # 更新 label
            sed -i 's|android:label="local_ai_assistant"|android:label="本地智能助手"|' android/app/src/main/AndroidManifest.xml
          fi
          # 更新 app/build.gradle minSdk
          sed -i 's|minSdk [0-9]*|minSdk 26|' android/app/build.gradle

      - name: Verify Flutter environment
        run: |
          flutter doctor -v
          echo "--- Android dir ---"
          ls -la android/app/src/main/

      - name: Verify Android project
        run: |
          # 先创建一个测试项目验证环境正常
          mkdir -p /tmp/test_flutter
          cd /tmp/test_flutter
          flutter create --platforms android test_app --org com.test 2>&1 | tail -3
          cd test_app
          flutter build apk --release 2>&1 | tail -5 || echo "TEST BUILD FAILED"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.jks \
            -alias local-ai-assistant \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass localai123456 \
            -keypass localai123456 \
            -dname "CN=LocalAI, OU=Dev, O=Personal, L=BJ, ST=BJ, C=CN"

      - name: Build APK
        run: flutter build apk --release

      - name: Sign APK with apksigner
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/)/apksigner sign \
            --ks android/app/release.jks \
            --ks-key-alias local-ai-assistant \
            --ks-pass pass:localai123456 \
            --key-pass pass:localai123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/)/apksigner verify \
            --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
