name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee /tmp/build_log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload build log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build_log
          path: /tmp/build_log.txt

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore android/app/release.jks -alias local-ai-assistant -keyalg RSA -keysize 2048 -validity 36500 -storepass localai123456 -keypass localai123456 -dname "CN=LocalAI" 2>&1
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks android/app/release.jks --ks-key-alias local-ai-assistant --ks-pass pass:localai123456 --key-pass pass:localai123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
