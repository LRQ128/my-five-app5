name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Accept licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          yes | flutter doctor --android-licenses 2>&1 || true

      - name: Save environment diagnostics
        run: |
          mkdir -p /tmp/diag
          set +e
          flutter doctor -v > /tmp/diag/01_flutter_doctor.txt 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME" > /tmp/diag/02_env.txt
          echo "JAVA_HOME=$JAVA_HOME" >> /tmp/diag/02_env.txt
          flutter --version >> /tmp/diag/02_env.txt
          cat /tmp/diag/01_flutter_doctor.txt | grep -i "error\|warning\|✗" > /tmp/diag/01_issues.txt 2>&1 || true

      - name: Generate Android project with flutter create
        run: |
          rm -rf android/
          flutter create --platforms android --project-name local_ai_assistant --force .
          # Apply custom Android config
          sed -i 's|minSdk [0-9]*|minSdk 26|' android/app/build.gradle
          # Customize AndroidManifest
          manifest="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />|' "$manifest"
          sed -i 's|<application|<application\n        android:largeHeap="true"|' "$manifest"
          sed -i 's|android:label="local_ai_assistant"|android:label="本地智能助手"|' "$manifest"

      - name: Save generated Android config
        run: |
          cat android/app/build.gradle > /tmp/diag/03_app_build.gradle.txt
          cat android/settings.gradle > /tmp/diag/04_settings.gradle.txt
          cat android/build.gradle > /tmp/diag/05_project_build.gradle.txt
          cat android/app/src/main/AndroidManifest.xml > /tmp/diag/06_manifest.txt
          find android/ -name '*.gradle' -o -name '*.xml' -o -name '*.properties' -o -name '*.kt' > /tmp/diag/07_android_files.txt


      - name: Flutter pub get
        run: flutter pub get 2>&1 | tee /tmp/diag/08_pub_get.txt

      - name: Check .flutter-plugins
        run: cat .flutter-plugins-dependencies > /tmp/diag/08_plugins.txt 2>&1 || echo "no plugins" > /tmp/diag/08_plugins.txt

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.jks \
            -alias local-ai-assistant \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass localai123456 \
            -keypass localai123456 \
            -dname "CN=LocalAI, OU=Dev, O=Personal, L=BJ, ST=BJ, C=CN"

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee /tmp/diag/09_build_log.txt
          exit ${PIPESTATUS[0]}

      - name: Save error log to repo on failure
        if: failure()
        run: |
          mkdir -p /tmp/error_log
          echo "Build failed at $(date -u)" > /tmp/error_log/build_failure.md
          echo "" >> /tmp/error_log/build_failure.md
          echo "## Run #${{ github.run_number }}" >> /tmp/error_log/build_failure.md
          echo "Commit: ${{ github.sha }}" >> /tmp/error_log/build_failure.md
          echo "" >> /tmp/error_log/build_failure.md
          echo '```' >> /tmp/error_log/build_failure.md
          cat /tmp/diag/09_build_log.txt >> /tmp/error_log/build_failure.md 2>/dev/null || echo "No build log" >> /tmp/error_log/build_failure.md
          cat /tmp/diag/08_pub_get.txt >> /tmp/error_log/build_failure.md 2>/dev/null || echo "No pub get log" >> /tmp/error_log/build_failure.md
          echo '```' >> /tmp/error_log/build_failure.md
          cat /tmp/diag/*.txt 2>/dev/null | grep -i "error\|failed\|embedding\|Could not\|✗" | head -20 >> /tmp/error_log/build_failure.md || true
          echo "Log saved to /tmp/error_log/build_failure.md"

      - name: Commit error log to repo
        if: failure()
        run: |
          cp /tmp/error_log/build_failure.md ./build_failure_${{ github.run_number }}.md
          git config user.name "CI Bot"
          git config user.email "ci@local-ai-assistant"
          git add ./build_failure_${{ github.run_number }}.md
          git commit -m "build failure log for run #${{ github.run_number }}"
          git push origin HEAD:master 2>&1 || echo "Push failed (expected if another build is running)"

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: /tmp/diag/

      - name: Sign APK
        if: success()
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/)/apksigner sign \
            --ks android/app/release.jks \
            --ks-key-alias local-ai-assistant \
            --ks-pass pass:localai123456 \
            --key-pass pass:localai123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"

      - name: Verify signature
        if: success()
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/)/apksigner verify \
            --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
