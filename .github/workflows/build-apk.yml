name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build libllama.so (Android native)
        run: |
          git clone --depth=1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cd /tmp/llama.cpp
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26             -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON             -DLLAMA_CUDA=OFF -DLLAMA_METAL=OFF -DLLAMA_VULKAN=OFF             -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF             ..
          cmake --build . --target llama -j$(nproc)
          find . -name "libllama.so" -exec cp {} ${{ github.workspace }}/android/app/src/main/jniLibs/arm64-v8a/ \;
          ls -lh ${{ github.workspace }}/android/app/src/main/jniLibs/arm64-v8a/libllama.so

      - name: Apply Android config
        run: |
          mkdir -p assets/models/ fonts/
          touch assets/models/.gitkeep fonts/.gitkeep
          sed -i 's|minSdk = flutter\.minSdkVersion|minSdk 26|' android/app/build.gradle || true

      - name: Pub get
        run: flutter pub get

      - name: Dart analyze (diagnostic)
        run: flutter analyze --no-pub 2>&1 | tee /tmp/analyze_log.txt

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee /tmp/build_log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload build log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build_log
          path: |
            /tmp/build_log.txt
            /tmp/analyze_log.txt

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore android/app/release.jks -alias local-ai-assistant -keyalg RSA -keysize 2048 -validity 36500 -storepass localai123456 -keypass localai123456 -dname "CN=LocalAI" 2>&1
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks android/app/release.jks --ks-key-alias local-ai-assistant --ks-pass pass:localai123456 --key-pass pass:localai123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
