name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Regenerate Android project
        run: flutter create --platforms=android --project-name local_ai_assistant . 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.jks \
            -alias local-ai-assistant \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass localai123456 \
            -keypass localai123456 \
            -dname "CN=LocalAI, OU=Dev, O=Personal, L=BJ, ST=BJ, C=CN"

      - name: Flutter clean
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Sign APK with apksigner (v1+v2+v3)
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks android/app/release.jks \
            --ks-key-alias local-ai-assistant \
            --ks-pass pass:localai123456 \
            --key-pass pass:localai123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 本地AI助手 - APK Release
            
            **Build**: #${{ github.run_number }}
            **Commit**: ${{ github.sha }}
            
            ### 功能
            - llama.cpp 本地大模型推理 (Qwen2.5-7B-Q4_K_M)
            - Agent引擎 + 工具调用
            - 多模型热切换 (7B/14B)
            - 联网搜索/计算器/天气/备忘录
            - OpenClaw风格聊天界面
            
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
