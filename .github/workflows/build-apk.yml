name: Build Flutter APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:3.24.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.jks \
            -alias local-ai-assistant \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass localai123456 \
            -keypass localai123456 \
            -dname "CN=LocalAI, OU=Dev, O=Personal, L=BJ, ST=BJ, C=CN"

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Sign APK with apksigner
        run: |
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/\$(ls $ANDROID_SDK_ROOT/build-tools/)/apksigner"
          "\$APKSIGNER" sign \
            --ks android/app/release.jks \
            --ks-key-alias local-ai-assistant \
            --ks-pass pass:localai123456 \
            --key-pass pass:localai123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/\$(ls $ANDROID_SDK_ROOT/build-tools/)/apksigner"
          "\$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
